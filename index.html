
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOMER X</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">N<span>X</span></div>
      <div>
        <h1>NOMER X</h1>
        <p>NUMBER COLLECTION</p>
      </div>
      <div class="coin">🪙 <span id="balance">0</span></div>
    </header>

    <main>
      <div class="tag">✦ NUMBER ROULETTE ✦</div>
      <h2>ТВОЙ НОМЕР</h2>
      <p class="subtitle">Испытай удачу и найди редкий номер</p>

      <div class="glow"></div>
      <div class="plate">
        <div class="uz">UZ</div>
        <strong id="number">01 X 777 XX</strong>
      </div>

      <div class="rarity" id="rarity">ГОТОВ К КРУТКЕ</div>

      <div class="price-box">
        <span>СТОИМОСТЬ НОМЕРА</span>
        <h2 id="price">— сум</h2>
      </div>

      <button class="spin" id="spin">✦ КРУТИТЬ НОМЕР</button>
      <button class="sell" id="sell" disabled>ПРОДАТЬ НОМЕР</button>

      <div class="history-head">
        <h3>ИСТОРИЯ НОМЕРОВ</h3>
        <span id="count">0 номеров</span>
      </div>
      <div id="history" class="history">
        <div class="empty">Твои номера появятся здесь</div>
      </div>
    </main>

    <footer>NOMER X <span>◆</span> GAME</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
